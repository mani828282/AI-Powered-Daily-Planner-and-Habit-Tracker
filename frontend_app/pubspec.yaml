name: frontend_app
description: "AI-Powered Daily Planner & Habit Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^3.0.0
  
  # State Management
  provider: ^6.1.1
  
  # Networking
  http: ^1.1.2
  dio: ^5.4.0
  http_parser: ^4.0.2
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Charts & Visualization
  fl_chart: ^0.66.0
  
  # Date & Time
  intl: ^0.19.0
  table_calendar: ^3.0.9
  
  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0
  
  # Animations
  animated_text_kit: ^4.2.2
  shimmer: ^3.0.0
  confetti: ^0.7.0
  
  # Icons
  font_awesome_flutter: ^10.6.0
  
  # Utils
  uuid: ^4.3.3
  
  # Voice Recording
  record: ^6.2.0
  path_provider: ^2.1.0
  permission_handler: ^11.0.0
  image_picker: ^1.2.1

  # Screen Time / Digital Addiction Tracking (Android)
  app_usage: ^4.0.1
  workmanager: ^0.6.0
  installed_apps: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  
  # Add assets here
  assets:
    - assets/icons/
